<!DOCTYPE html>
<!--
  LIJSTJE PAGE
  Shared, synced shopping list. Logic lives in
  assets/js/modules/lijstje.js — this file only contains
  the markup (status line, list, add-form) that the module fills in
  and wires up. Data is stored in Cloudflare KV via a small Worker
  (cloudflare/lijstje/), so both of you see the
  same list — see ACTION-EXPANSION-PLAN.md for how to deploy it.
-->
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Ons gedeelde lijstje, samen bijgehouden.">
  <meta name="theme-color" content="#F5F5F5">

  <title>Lijstje</title>

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages/lijstje.css">
</head>
<body>
  <a class="skip-link" href="#main">Ga naar inhoud</a>

  <noscript>
    <p style="text-align:center; padding:1rem; background:#FFD700;">
      Deze pagina heeft JavaScript nodig om te werken.
    </p>
  </noscript>

  <div data-include="header"></div>

  <main id="main">
    <section id="hero" class="hero">
      <div class="container">
        <h1>🛒 Lijstje</h1>
        <p>Samen bijgehouden.</p>
      </div>
    </section>

    <section class="container" id="shoppingListApp">
      <!-- Shown instead of the app if config.js's workerUrl is still the placeholder -->
      <div id="slConfigWarning" class="sl-config-warning hidden">
        ⚠️ Nog geen Worker gekoppeld. Zie <strong>ACTION-EXPANSION-PLAN.md</strong>
        om de sync tussen jullie twee werkend te krijgen.
      </div>

      <!-- Category switcher: which list (e.g. "Boodschappen", "Klussen")
           is currently shown. Filled in + wired up by lijstje.js.
           "+ Nieuwe lijst" and (with 2+ lists) "Lijsten wijzigen" always
           render last, below a divider. "Lijsten wijzigen" swaps the
           menu into an edit view — drag handle + rename (✏️) + delete
           (✕) per list — until "Klaar" is clicked again. -->
      <div class="sl-list-switcher" id="slListSwitcher">
        <button
          type="button"
          id="slListTrigger"
          class="sl-list-trigger"
          aria-haspopup="true"
          aria-expanded="false"
        >
          <span id="slListTriggerLabel">Lijstje</span>
          <span class="chevron">▾</span>
        </button>
        <div id="slListMenu" class="sl-list-menu" role="menu"></div>
      </div>

      <p id="slStatus" class="sl-status" aria-live="polite">Laden…</p>

      <ul id="slItems" class="sl-list" aria-label="Lijstje"></ul>

      <div id="slEmptyState" class="empty-state hidden">
        Lijstje is leeg, voeg hieronder iets toe.
      </div>

      <form id="slAddForm" class="sl-add-form">
        <input
          type="text"
          id="slAddInput"
          placeholder="Bijvoorbeeld sushi..."
          maxlength="200"
          aria-label="Nieuw item toevoegen"
        >
        <button type="submit" class="btn btn-primary">Toevoegen</button>
      </form>
      <p id="slAddError" class="sl-add-error" aria-live="polite"></p>
    </section>
  </main>

  <div data-include="chrome-end"></div>

  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
