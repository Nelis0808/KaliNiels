<!DOCTYPE html>
<!--
  HOME PAGE
  The "hub" page: shows the days-together counter and a grid of
  cards linking to every feature page. The card grid is rendered
  by JS (assets/js/modules/home-cards.js) from the single source
  of truth in assets/js/config.js — add a new feature page there,
  not here.
-->
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">

  <!-- This is a private, personal site — keep it out of search engines.
       Remove this tag if you ever want the site publicly discoverable. -->
  <meta name="robots" content="noindex, nofollow">

  <meta name="description" content="Onze persoonlijke site vol date ideeën en herinneringen.">
  <meta name="theme-color" content="#F5F5F5">

  <title>Home</title>

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">

  <!-- Google Fonts: Fraunces for headings, Inter for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- main.css = shared design system, always first.
       pages/home.css = rules unique to this page only. -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages/home.css">
</head>
<body>
  <!-- Keyboard users can jump straight past the header to the content -->
  <a class="skip-link" href="#main">Ga naar inhoud</a>

  <noscript>
    <p style="text-align:center; padding:1rem; background:#FFD700;">
      Deze site werkt het best met JavaScript ingeschakeld.
    </p>
  </noscript>

  <!-- ============ Shared header — kept identical on every page ============ -->
  <div data-include="header"></div>

  <main id="main">
    <section id="page-guide" class="container">
      <h1 class="text-center">
        Samen voor <u><span id="daysTogether">0</span></u> dagen
        <span class="heart-beat" aria-hidden="true">❤️</span>
      </h1>

      <!-- Populated by assets/js/modules/home-cards.js from siteConfig.pages -->
      <div id="pageCardsGrid" class="cards-grid"></div>
    </section>
  </main>

  <div data-include="chrome-end"></div>

  <!-- Plain (non-module) safety net: if assets/js/main.js fails to
       even load as a module (404, wrong MIME type, ad-blocker,
       blocked script, ...), the browser gives no visible error and
       the page is left showing only its static HTML — exactly like
       this. type="module" scripts fail silently in that case, so
       this tiny classic script checks in a few seconds later
       whether main.js ever ran (it sets window.__siteMainRan = true
       right after its imports run) and shows a plain-language message if
       not, instead of a page that just looks broken with no clue why. -->
  <script>
    setTimeout(function () {
      if (window.__siteMainRan) return;
      var banner = document.createElement('div');
      banner.setAttribute('role', 'alert');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#B00020;color:#fff;font:14px/1.5 system-ui,sans-serif;padding:10px 16px;text-align:center;';
      banner.textContent = 'Deze pagina kon assets/js/main.js niet laden (netwerkfout, verkeerd pad, of geblokkeerd script). Open de browserconsole (F12) voor details.';
      document.body && document.body.prepend(banner);
    }, 4000);
  </script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
