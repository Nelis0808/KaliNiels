<!DOCTYPE html>
<!--
  DATE IDEAS PAGE
  Picks a random idea from assets/data/date-ideas-indoor.json or
  date-ideas-outdoor.json (see assets/js/modules/date-picker.js).
  Add more ideas by editing those two JSON files — no code changes
  needed. Add a third category by following the pattern documented
  at the top of date-picker.js.
-->
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Kies een willekeurig date-idee, binnen of buiten.">
  <meta name="theme-color" content="#F5F5F5">

  <title>Date Ideeën</title>

  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/pages/date-ideas.css">
</head>
<body>
  <a class="skip-link" href="#main">Ga naar inhoud</a>

  <noscript>
    <p style="text-align:center; padding:1rem; background:#FFD700;">
      Deze pagina heeft JavaScript nodig om ideeën te kunnen kiezen.
    </p>
  </noscript>

  <div data-include="header"></div>

  <main id="main">
    <section id="hero" class="hero">
      <div class="container">
        <h1>Activiteiten deze maand?</h1>
        <p>We laten dat lekker door lot beslissen...</p>

        <div class="hero-buttons">
          <button id="btnBinnen" class="btn btn-primary">Binnen activiteit</button>
          <button id="btnBuiten" class="btn btn-primary">Buiten activiteit</button>
        </div>
      </div>
    </section>

    <!-- Filled by assets/js/modules/date-picker.js. aria-live so screen
         reader users are told when a new idea appears, aria-busy while
         the (cached-after-first-load) JSON is being fetched. -->
    <div class="results">
      <div id="resultBinnen" class="result-box" aria-live="polite" aria-busy="false"></div>
      <div id="resultBuiten" class="result-box" aria-live="polite" aria-busy="false"></div>
    </div>
  </main>

  <div data-include="chrome-end"></div>

  <!-- Plain (non-module) safety net: if assets/js/main.js fails to
       even load as a module (404, wrong MIME type, ad-blocker,
       blocked script, ...), the browser gives no visible error and
       the page is left showing only its static HTML — exactly like
       this. type="module" scripts fail silently in that case, so
       this tiny classic script checks in a few seconds later
       whether main.js ever ran (it sets window.__siteMainRan = true
       right after its imports run) and shows a plain-language message if
       not, instead of a page that just looks broken with no clue why. -->
  <script>
    setTimeout(function () {
      if (window.__siteMainRan) return;
      var banner = document.createElement('div');
      banner.setAttribute('role', 'alert');
      banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;background:#B00020;color:#fff;font:14px/1.5 system-ui,sans-serif;padding:10px 16px;text-align:center;';
      banner.textContent = 'Deze pagina kon assets/js/main.js niet laden (netwerkfout, verkeerd pad, of geblokkeerd script). Open de browserconsole (F12) voor details.';
      document.body && document.body.prepend(banner);
    }, 4000);
  </script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
